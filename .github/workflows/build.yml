name: Build Shittm Canvas

on:
  push:
    branches:
      - dev
      - actions
  workflow_dispatch:

jobs:
  build:
    name: Build Project
    runs-on: windows-latest
    steps:
      # 1. 清理工作目录
      - name: Clean workspace
        run: |
          Remove-Item * -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item .* -Recurse -Force -ErrorAction SilentlyContinue

      # 2. Clone 外部仓库（改成你要的仓库地址和分支）
      - name: Clone External Project
        run: |
          git clone https://github.com/Jan-Arbus/Shittim_Canvas.git --depth=1 -b main ProjectSource

      # 3. 切换到项目目录
      - name: Move project files
        run: |
          Get-ChildItem ProjectSource -Force | Move-Item -Destination . -Force

      # Cache
      - uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

#      # Test
#      - name: Run tests
#        uses: game-ci/unity-test-runner@v4
#        env:
#          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
#          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
#          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
#        with:
#          githubToken: ${{ secrets.GITHUB_TOKEN }}
#
      # Build
      - name: Build project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          buildName: Shittim_Canvas

      # Output
      - uses: actions/upload-artifact@v4
        with:
          name: Build
          path: build